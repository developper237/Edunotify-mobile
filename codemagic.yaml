# ─────────────────────────────────────────────────────────────────────────────
# Codemagic CI/CD — SmartCampus (Flutter / iOS)
#
# Trois workflows au choix :
#
#   ios-unsigned    → IPA NON signée, à installer avec Sideloadly ou AltStore
#                     sur Windows/iPhone, en utilisant un simple identifiant
#                     Apple GRATUIT. Aucun compte Apple Developer payant n'est
#                     nécessaire. Contrepartie : l'app expire au bout de 7 jours
#                     et doit être réinstallée.
#
#   ios-testflight  → IPA signée App Store + envoi automatique vers TestFlight
#                     (en « internal testing only » : pas de revue Apple à
#                     attendre, le build apparaît tout de suite dans TestFlight).
#                     Prérequis : compte Apple Developer Program, app créée dans
#                     App Store Connect (bundle id cm.smartcampus.app), et une
#                     clé API « Developer Portal » nommée smartcampus_appstore.
#
#   ios-adhoc       → IPA ad-hoc à installer directement (3uTools, iMazing,
#                     Sideloadly…). Prérequis : l'UDID de chaque iPhone de test
#                     doit être enregistré côté Apple Developer (et le profil
#                     ad-hoc correspondant disponible dans Codemagic).
#
# Les builds se lancent à la main (Applications → SmartCampus → Start new
# build) ou par API : aucun trigger automatique n'est configuré.
#
# Variables d'environnement attendues dans le groupe « smartcampus »
# (Applications → SmartCampus → Environment variables) :
#   GOOGLE_SERVICE_INFO_PLIST_B64 = base64 du GoogleService-Info.plist (Firebase
#                                   iOS). Facultatif : sans elle le build passe
#                                   mais les notifications push restent muettes.
# ─────────────────────────────────────────────────────────────────────────────

workflows:
  # ── 1) IPA non signée : installation gratuite via Sideloadly / AltStore ────
  # Aucune signature Apple, donc aucun compte Apple Developer payant requis :
  # Sideloadly signe lui-même l'IPA avec ton identifiant Apple gratuit.
  # ⚠ l'app installée expire au bout de 7 jours (il faut la réinstaller),
  # 3 applications maximum et les notifications push ne sont pas disponibles.
  ios-unsigned:
    name: SmartCampus iOS — IPA non signée (Sideloadly / AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.41.5
      xcode: latest
      cocoapods: default

      groups:
        - smartcampus

      vars:
        BUNDLE_ID: cm.smartcampus.app

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Forcer CocoaPods (Swift Package Manager désactivé)
        script: |
          # Flutter 3.44+ active Swift Package Manager par défaut, et les
          # binaires Firebase tirés par SPM échouent régulièrement à se
          # télécharger (« ... already exists in file system »). Le projet est
          # configuré pour CocoaPods (ios/Podfile) : on force ce mode, y compris
          # si une version plus récente de Flutter est utilisée.
          flutter --version
          flutter config --no-enable-swift-package-manager || true
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm" build/ios/SourcePackages || true

      - name: Dépendances Dart
        script: flutter pub get

      - name: Dépendances CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Compiler sans signature
        script: |
          set -e
          NUM="${BUILD_NUMBER:-$(date +%s)}"
          echo "Numéro de build iOS : $NUM"
          flutter build ios --release --no-codesign --build-number="$NUM"

      - name: Empaqueter l'IPA non signée
        script: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          zip -qry SmartCampus-unsigned.ipa Payload
          echo "IPA prête : $(du -h SmartCampus-unsigned.ipa | cut -f1)"

    artifacts:
      - build/ios/iphoneos/SmartCampus-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log

  # ── 2) TestFlight : réservé aux comptes Apple Developer payants ────────────
  ios-testflight:
    name: SmartCampus iOS — TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Nom de la clé API créée dans
    # Team settings → Team integrations → Developer Portal → Manage keys.
    # ⚠ ce nom doit être identique à celui saisi dans Codemagic.
    integrations:
      app_store_connect: smartcampus_appstore

    environment:
      flutter: 3.41.5 # meme version que le poste de dev (sinon mettre "stable")
      xcode: latest
      cocoapods: default

      # Signature : Codemagic récupère le certificat de distribution et le
      # profil de provisionnement correspondant au bundle id, parmi les fichiers
      # présents dans Team settings → codemagic.yaml settings → Code signing.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: cm.smartcampus.app

      groups:
        - smartcampus

      vars:
        BUNDLE_ID: cm.smartcampus.app

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Configurer Firebase pour iOS (facultatif)
        script: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "GoogleService-Info.plist écrit dans ios/Runner/"
          else
            echo "Aucun GoogleService-Info.plist fourni : build sans notifications push iOS."
          fi

      - name: Forcer CocoaPods (Swift Package Manager désactivé)
        script: |
          # Flutter 3.44+ active Swift Package Manager par défaut, et les
          # binaires Firebase tirés par SPM échouent régulièrement à se
          # télécharger (« ... already exists in file system »). Le projet est
          # configuré pour CocoaPods (ios/Podfile) : on force ce mode, y compris
          # si une version plus récente de Flutter est utilisée.
          flutter --version
          flutter config --no-enable-swift-package-manager || true
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm" build/ios/SourcePackages || true

      - name: Dépendances Dart
        script: flutter pub get

      - name: Dépendances CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Appliquer les profils de signature
        script: |
          # testFlightInternalTestingOnly : distribue uniquement aux testeurs
          # internes, donc sans revue Apple préalable (disponible tout de suite).
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Compiler l'IPA
        script: |
          set -e
          # BUILD_NUMBER est le compteur de builds Codemagic : il doit augmenter
          # à chaque envoi pour qu'App Store Connect accepte l'upload.
          NUM="${BUILD_NUMBER:-$(date +%s)}"
          echo "Numéro de build iOS : $NUM"
          flutter build ipa --release \
            --build-number="$NUM" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ── 3) Ad-hoc : IPA à installer soi-même sur les iPhone enregistrés ────────
  ios-adhoc:
    name: SmartCampus iOS — iPhone (ad-hoc)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: 3.41.5
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: cm.smartcampus.app

      groups:
        - smartcampus

      vars:
        BUNDLE_ID: cm.smartcampus.app

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Configurer Firebase pour iOS (facultatif)
        script: |
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          else
            echo "Aucun GoogleService-Info.plist fourni : build sans notifications push iOS."
          fi

      - name: Forcer CocoaPods (Swift Package Manager désactivé)
        script: |
          # Flutter 3.44+ active Swift Package Manager par défaut, et les
          # binaires Firebase tirés par SPM échouent régulièrement à se
          # télécharger (« ... already exists in file system »). Le projet est
          # configuré pour CocoaPods (ios/Podfile) : on force ce mode, y compris
          # si une version plus récente de Flutter est utilisée.
          flutter --version
          flutter config --no-enable-swift-package-manager || true
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm" build/ios/SourcePackages || true

      - name: Dépendances Dart
        script: flutter pub get

      - name: Dépendances CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Appliquer les profils de signature
        script: |
          xcode-project use-profiles

      - name: Compiler l'IPA
        script: |
          set -e
          NUM="${BUILD_NUMBER:-$(date +%s)}"
          echo "Numéro de build iOS : $NUM"
          flutter build ipa --release \
            --build-number="$NUM" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
